<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{shop_name}</title></head>
<body style="margin:0;padding:0;background:#F4F5F7;font-family:Arial,Helvetica,sans-serif;color:#14161A;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F5F7;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border-radius:14px;overflow:hidden;">
      <tr><td style="padding:24px 24px 8px;text-align:center;"><a href="{shop_url}"><img src="{shop_logo}" alt="{shop_name}" style="max-width:180px;max-height:60px;border:0;"></a></td></tr>
      <tr><td style="padding:8px 24px 0;">
        <p style="font-size:13px;color:#5B6170;margin:0 0 4px;">Reparación {reference} · {device}</p>
        <h1 style="font-size:22px;margin:0 0 12px;color:#14161A;">{status}</h1>
        <p style="font-size:15px;line-height:1.5;margin:0 0 8px;">Hola {firstname},</p>
        <p style="font-size:15px;line-height:1.5;margin:0 0 20px;white-space:pre-line;">{message}</p>
      </td></tr>
      <tr><td style="padding:0 24px 24px;" align="center">
        <a href="{button_url}" style="display:inline-block;background:#0B6E4B;color:#FFFFFF;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 22px;border-radius:10px;">{button_text}</a>
      </td></tr>
      <tr><td style="padding:16px 24px;background:#F4F5F7;font-size:12px;color:#5B6170;text-align:center;">{shop_name} · {shop_phone}</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
